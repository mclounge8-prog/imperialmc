<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Заявки — MC Lounge Роза</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="login-screen" id="login">
    <form class="panel login-card form" id="loginForm">
      <a class="brand" href="/">
        <img src="/logo-white.webp" alt="" width="72" height="42">
        <span><small>MC Lounge</small><strong>Заявки</strong></span>
      </a>
      <h1 style="font-size:40px">Вход</h1>
      <label class="field"><span>Пароль</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="loginError"></p>
      <button class="primary" type="submit">Открыть</button>
    </form>
  </div>
  <div class="wrap" id="desk" hidden>
    <header class="top">
      <a class="brand" href="/">
        <img src="/logo-white.webp" alt="" width="92" height="53">
        <span><small>MC Lounge Роза</small><strong>Заявки</strong></span>
      </a>
      <button class="ghost" type="button" id="logout">Выйти</button>
    </header>
    <div class="stats" id="stats"></div>
    <h2 style="font-family:var(--font-display);font-weight:600">Схема зала</h2>
    <p class="note">Та же сетка, что в расстановке столов. Перетащите стол — гости увидят новое место. Цена одного места своя у каждого стола и кассу не меняет.</p>
    <div class="zones" id="zones"></div>
    <div id="floor" class="floor"></div>
    <form class="panel table-editor" id="tableEditor" hidden>
      <strong id="editorTitle"></strong>
      <label class="field"><span>Мест к брони</span>
        <input id="editorSeats" type="number" min="1" max="30">
      </label>
      <label class="field"><span>Цена места, ₽</span>
        <input id="editorPrice" type="number" min="0" max="1000000" step="1" inputmode="numeric">
      </label>
      <div class="field">
        <span>Размер на сетке</span>
        <div class="zones" id="editorSizes">
          <button type="button" class="chip" data-size="small">2×2</button>
          <button type="button" class="chip" data-size="medium">3×2</button>
          <button type="button" class="chip" data-size="large">4×3</button>
        </div>
      </div>
      <label><input id="editorOpen" type="checkbox"> открыт для брони</label>
      <button class="ghost" type="submit">Сохранить стол</button>
    </form>
    <h2 style="font-family:var(--font-display);font-weight:600">Заявки</h2>
    <div class="board" id="board"></div>
  </div>
  <script src="/plan.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
