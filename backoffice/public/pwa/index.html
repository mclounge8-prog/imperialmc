<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Imperial MC — Показатели</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#121214">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Imperial MC">

  <link rel="manifest" href="/pwa/manifest.webmanifest">
  <link rel="icon" href="/pwa/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/pwa/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pwa/css/pwa.css">
</head>
<body class="is-login">

  <!-- Экран входа: тот же логин/пароль, что и в бэкофисе -->
  <main class="login-screen" id="loginScreen">
    <div class="brand-mark">
      <img src="/img/logo-white.webp?v=imc4" alt="Imperial MC" width="220" height="127">
      <div class="brand-sonic" aria-hidden="true">
        <span class="brand-sonic-ring"></span>
        <span class="brand-sonic-ring"></span>
        <span class="brand-sonic-ring"></span>
        <div class="brand-eq">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span>
        </div>
      </div>
    </div>
    <div class="login-card">
      <p class="eyebrow">Показатели</p>
      <h1>Вход</h1>
      <form id="loginForm" autocomplete="on">
        <label for="username">Логин</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" id="loginSubmit">Войти</button>
        <div class="error" id="loginError" role="alert" aria-live="polite"></div>
      </form>
    </div>
  </main>

  <!-- Основной экран — до входа скрыт -->
  <div class="app-screen screen-hidden" id="appScreen" aria-hidden="true">
    <header class="app-header">
      <button type="button" class="icon-btn" id="logoutBtn" aria-label="Выйти" title="Выйти">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>

      <!-- Дата для вкладки «Показатели» -->
      <div class="date-pill" id="datePill">
        <div class="date-pill-text">
          <span class="date-pill-primary" id="datePrimary">—</span>
          <span class="date-pill-compare" id="dateCompare">—</span>
        </div>
        <span class="date-pill-pencil" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
        </span>
        <input type="date" id="dateInput" class="date-pill-input" aria-label="Выбрать дату">
      </div>

      <!-- Период для вкладки «Отчёты» -->
      <div class="date-pill period-pill screen-hidden" id="periodPill" aria-hidden="true">
        <div class="date-pill-text">
          <span class="date-pill-primary" id="periodPrimary">—</span>
          <span class="date-pill-compare" id="periodSecondary">период</span>
        </div>
      </div>

      <button type="button" class="icon-btn" id="refreshBtn" aria-label="Обновить" title="Обновить">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><polyline points="21 3 21 8 16 8"/></svg>
      </button>
    </header>

    <h1 class="page-title" id="pageTitle">Показатели</h1>

    <div class="venue-pill" id="venuePill">
      <span class="venue-pill-chevron" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
      </span>
      <span class="venue-pill-text" id="venueLabel">Все заведения</span>
      <select id="venueSelect" class="venue-pill-select" aria-label="Выбрать заведение">
        <option value="">Все заведения</option>
      </select>
    </div>

    <!-- Вкладка: Показатели -->
    <section class="tab-panel" id="tabMetrics" data-tab="metrics">
      <main class="cards" id="cards">
        <!-- карточки статистики рендерятся в js/pwa.js -->
      </main>
      <p class="updated-hint" id="updatedHint"></p>
    </section>

    <!-- Вкладка: Отчёты -->
    <section class="tab-panel screen-hidden" id="tabReports" data-tab="reports" aria-hidden="true">
      <div class="segmented" id="reportKind" role="tablist" aria-label="Тип отчёта">
        <button type="button" class="segmented-btn is-active" data-kind="items" role="tab" aria-selected="true">Блюда</button>
        <button type="button" class="segmented-btn" data-kind="receipts" role="tab" aria-selected="false">Чеки</button>
      </div>

      <div class="preset-row" id="reportPresets" role="group" aria-label="Период">
        <button type="button" class="preset-chip" data-preset="today">Сегодня</button>
        <button type="button" class="preset-chip" data-preset="yesterday">Вчера</button>
        <button type="button" class="preset-chip is-active" data-preset="last7">7 дней</button>
        <button type="button" class="preset-chip" data-preset="week">Неделя</button>
        <button type="button" class="preset-chip" data-preset="month">Месяц</button>
        <button type="button" class="preset-chip" data-preset="custom">Период</button>
      </div>

      <div class="range-row screen-hidden" id="reportRangeRow" aria-hidden="true">
        <label class="range-field">
          <span>С</span>
          <input type="date" id="reportFrom" aria-label="Дата с">
        </label>
        <label class="range-field">
          <span>По</span>
          <input type="date" id="reportTo" aria-label="Дата по">
        </label>
        <button type="button" class="range-apply" id="reportRangeApply">Показать</button>
      </div>

      <div class="report-summary" id="reportSummary"></div>
      <div class="report-list" id="reportList" aria-busy="false"></div>
      <div class="report-pager screen-hidden" id="reportPager" aria-hidden="true">
        <button type="button" class="pager-btn" id="reportPrev" disabled>Назад</button>
        <span class="pager-label" id="reportPageLabel">1</span>
        <button type="button" class="pager-btn" id="reportNext" disabled>Ещё</button>
      </div>
    </section>

    <nav class="bottom-nav" id="bottomNav" aria-label="Разделы">
      <button type="button" class="bottom-nav-btn is-active" data-tab="metrics" aria-current="page">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 3 5-6"/></svg>
        <span>Показатели</span>
      </button>
      <button type="button" class="bottom-nav-btn" data-tab="reports">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
        <span>Отчёты</span>
      </button>
    </nav>
  </div>

  <!-- Детальный график / чек -->
  <div class="chart-sheet screen-hidden" id="chartSheet" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="chartSheetTitle">
    <button type="button" class="chart-sheet-backdrop" id="chartSheetClose" aria-label="Закрыть"></button>
    <div class="chart-sheet-panel">
      <div class="chart-sheet-handle" aria-hidden="true"></div>
      <div class="chart-sheet-header">
        <h2 id="chartSheetTitle">—</h2>
        <button type="button" class="icon-btn chart-sheet-x" id="chartSheetX" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="chart-sheet-compare" id="chartSheetCompare"></div>
      <div class="chart-sheet-plot" id="chartSheetPlot"></div>
      <div class="chart-sheet-legend">
        <span class="chart-legend-item"><span class="chart-legend-dot chart-legend-dot-selected"></span><span id="chartLegendSelected">Выбранный день</span></span>
        <span class="chart-legend-item"><span class="chart-legend-dot chart-legend-dot-compare"></span><span id="chartLegendCompare">Неделю назад</span></span>
      </div>
    </div>
  </div>

  <div class="update-toast screen-hidden" id="updateToast" role="status" aria-live="polite">
    <span>Доступна новая версия</span>
    <button type="button" id="updateToastBtn">Обновить</button>
  </div>

  <script src="/pwa/js/pwa.js"></script>
</body>
</html>
