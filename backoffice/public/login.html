<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бэкофис — вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/vendor/htmx.min.js"></script>
</head>
<body>
  <main class="login-screen">
    <div class="brand-mark">
      <img src="/img/logo-white.webp" alt="Imperial MC">
      <span class="underline" aria-hidden="true"></span>
    </div>
    <div class="login-card">
      <p class="eyebrow">Бэкофис</p>
      <h1>Панель управления</h1>
      <form hx-post="/api/auth/login" hx-target="#errorMsg" hx-swap="innerHTML">
        <label for="username">Логин</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Войти</button>
        <div class="error" id="errorMsg" role="alert" aria-live="polite"></div>
      </form>
    </div>
  </main>
</body>
</html>
